<!DOCTYPE html>
<html>
    <head>
        <title>Arrays and Loops</title>
        <style>
            
        </style>
    </head>
    <body>
        <script>
            //arrays
            const myArray = [10, 20, 30];
            console.log(myArray);

            console.log(myArray[1]);
            myArray[0] = 99;
            console.log(myArray);

            //we can use any type of value
            [1, 'hello', true, {name: 'Victor'}, [1, 2]]

            //it will tell us its an object and it is but it is a special type of object
            console.log(typeof [1, 2]);
            //the way to see if its an array:
            console.log(Array.isArray([1, 2]));

            //arrays have properties and methods
            console.log(myArray.length);

            //method to add a value at the end of the array
            myArray.push(100);
            
            /*
            method to remove a value, it ask for 2 values
            the index where it starts and the number of values it will remove
            */
            myArray.splice(0, 1);
            console.log(myArray);

            //loops
            let i = 1;
            
            while( i <= 5){    
                console.log(i);
                i++;
            }

            //like like in c
            for(let i = 1; i <= 5; i++){
                console.log(i);
            }

            let randomNumber = 0;
            //example of non standard loop
            while(randomNumber < 0.5){
                randomNumber = Math.random();
            }

            console.log(randomNumber);

            const todoList = [
                'make dinner',
                'wash dishes',
                'watch youtube'
            ];

            for(let i = 0; i < todoList.length; i++){
                console.log(todoList[i]);
            }

            const nums = [1, 1, 3];
            let total = 0;

            for(let i = 0; i < nums.length; i++){
                const num = nums[i];
                total += num;
            }
            console.log(total);

            const numsDoubled = [];

            for(let i = 0; i< nums.length; i++){
                const num = nums[i];
                numsDoubled.push(num * 2);
            }
            console.log(numsDoubled);
            

            //arrays are also a reference like the objects
            const array1 = [1, 2, 3];
            //we cant prevent it from being the same array with slice
            const array2 = array1.slice();
            array2.push(4);
            console.log(array1);
            console.log(array2);

            //destructuring
            const [firstValue, secondValue] = [1, 2, 3];

            for(let i = 1; i <= 10; i++){
                //continue to skip the iteration
                if (i % 3 === 0){
                    continue;
                }

                console.log(i);
                //break to stop the loop
                if (i === 8){
                    break;
                }
            }

            let i2 = 1;

            while(i2 <= 10){
                if (i2 % 3 === 0){
                    //we have to increment manually in a while
                    i2++;
                    continue;
                }
                console.log(i2);
                i2++;
            }

            function doubleArray(nums2){
                const numsDoubled2 = [];

                for(let i = 0; i< nums2.length; i++){
                    const num = nums2[i];
                    if (num === 0){
                        return numsDoubled2;
                    }
                    numsDoubled2.push(num * 2);
                }
                //console.log(numsDoubled2);
                return numsDoubled2;
            }

            console.log(doubleArray([1, 1, 3]));
            console.log(doubleArray([2, 2, 5, 0, 3]));
        </script>
    </body>
</html>
