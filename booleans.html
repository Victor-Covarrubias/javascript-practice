<!DOCTYPE html>
<html>
    <head>
        <title>Booleans</title>
        
    </head>
    <body>
        
        <script>
            console.log(3 > 5);

            //== converts both values into the same type
            console.log(5 == '5.0');
            //=== doesnt convert so its more exact
            console.log(5 === '5.0');

            if (false){
                console.log('hello');
            } else{
                console.log('else');
            }

            const age = 16;
            if (age >= 18) {
                console.log('you can drive');
            } else if (age >= 16){
                console.log('Almost there!');
            } else{
                console.log('you cant drive');
            }

            /*
            the statement behaves like a true so its denomined 
            a truthy value, to be false it has to be some of these
            false, 0, '', NaN, undefined or null
            */
            if (5){
                console.log('truthy value');
            }

            const cartQuantity = 5;

            if (cartQuantity){
                console.log('cart has products');
            }

            //example of NaN
            console.log('text' / 5);

            //example of undefined
            let variable1;
            console.log(variable1);

            /*
            Ternary operator its like a if the first value
            after the question mark is the one used if its true
            and the one next to the colon is used when the
            statement is false
            */
            const result = true ? 'truthy' : 'falsy'
            console.log(result);

            /*
            The Guard operator its just an and but it doesnt let 
            u use the second value if the first one is false
            */
            false && console.log('hello');
            /*
            here itll give the value hello since the first one
            is truthy
            */
            const message = 5 && 'hello'
            console.log(message);

            /*
            The Default operator is similar but we just an or
            this time it also stops in the first value since it just needs
            to check if the first value is true, this one works to create
            default values
            */
           const currency = 'EUR' || 'USD';
           console.log(currency);
        </script>
    </body>
</html>
