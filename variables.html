<!DOCTYPE html>
<html>
    <head>
        <title>Variables</title>
        
    </head>
    <body>
        
        <script>
            //we create variables with let
            //the only special caracters we can use in varuiables are $_
            let variable1 = 3;
            console.log(variable1);

            const calculation = 2 + 2;
            console.log(calculation);
            console.log(calculation + 2);

            const message = 'Hello';
            console.log(message); console.log(';');

            variable1 = 5;
            console.log(variable1);

            variable1 = variable1 + 1;
            console.log(variable1);
            //to create a constant
            const variable2 = 3;
            /*
            var was the original way to create variables
            in java script, we dont use it anymore cuz
            it doesnt folllow the rules of scope
            */
            var variable3 = 3;
            console.log(typeof variable2);
            console.log(typeof message);
        </script>
    </body>
</html>
